<div class="ink-bg-wrapper is-loaded" id="inkWrapper" aria-hidden="true">
  <div class="ink-scroll-layer" id="inkScrollLayer">
    <img
      src="{{ '/assets/images/homepage/homepage-texture-2.png' | relative_url }}"
      alt=""
      class="ink-static-fallback"
      loading="eager"
    />

    <svg id="inkSvg" viewBox="0 0 720 450" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="ink-master-filter" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <!-- Kecepatan riak diperjelas (6 detik bolak-balik) agar langsung terlihat -->
          <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015" numOctaves="2" seed="5" result="noise">
            <animate
              attributeName="baseFrequency"
              dur="6s"
              values="0.008 0.012; 0.025 0.035; 0.008 0.012"
              repeatCount="indefinite"
            />
          </feTurbulence>

          <!-- Skala distorsi besar (65) agar gelombang tinta nyata -->
          <feDisplacementMap
            id="inkDisplace"
            in="SourceGraphic"
            in2="noise"
            scale="65"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>

      <image
        id="inkImage"
        href="{{ '/assets/images/homepage/homepage-texture-2.png' | relative_url }}"
        x="-130" y="-130" width="980" height="710"
        preserveAspectRatio="xMidYMid slice"
        filter="url(#ink-master-filter)"
      />
    </svg>
  </div>
</div>

<script>
  (function() {
    const scrollLayer = document.getElementById('inkScrollLayer');
    const svgEl = document.getElementById('inkSvg');
    const inkImage = document.getElementById('inkImage');
    const inkDisplace = document.getElementById('inkDisplace');

    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const isTouchDevice = window.matchMedia('(pointer: coarse)');
    let isTicking = false;

    const shouldDisable = () => prefersReduced.matches || isTouchDevice.matches;

    function syncFilterState() {
      if (!svgEl || !inkImage) return;
      if (shouldDisable()) {
        svgEl.pauseAnimations();
        inkImage.removeAttribute('filter');
      } else {
        inkImage.setAttribute('filter', 'url(#ink-master-filter)');
        svgEl.unpauseAnimations();
      }
    }

    function updateInkOnScroll() {
      if (prefersReduced.matches || !scrollLayer) { isTicking = false; return; }
      const scrollY = window.scrollY;
      const progress = Math.min(Math.max(scrollY / (window.innerHeight * 1.1), 0), 1);

      scrollLayer.style.opacity = (1 - progress * 0.85).toFixed(3);
      scrollLayer.style.transform = `translate3d(0, ${-(scrollY * 0.16).toFixed(1)}px, 0) scale(${(1 + progress * 0.07).toFixed(3)})`;

      if (inkDisplace && !shouldDisable()) {
        inkDisplace.setAttribute('scale', (65 + progress * 35).toFixed(1));
      }
      isTicking = false;
    }

    syncFilterState();
    updateInkOnScroll();

    window.addEventListener('scroll', () => {
      if (!isTicking) {
        window.requestAnimationFrame(updateInkOnScroll);
        isTicking = true;
      }
    }, { passive: true });

    prefersReduced.addEventListener('change', syncFilterState);
    isTouchDevice.addEventListener('change', syncFilterState);
    document.addEventListener('visibilitychange', () => document.hidden ? svgEl?.pauseAnimations() : syncFilterState());
  })();
</script>
