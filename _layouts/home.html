<!DOCTYPE html>
<html lang="{{ site.language | default: 'id' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- jekyll-seo-tag akan inject otomatis -->
  {% seo title=false %}
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">

  <!-- Project Structured Data -->
  {% if page.layout == "home" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Ruang Ide-ide Aja - Projects",
    "description": "Kumpulan proyek Machine Learning dan Data Science oleh Anggun Sulis Setyawan",
    "hasPart": [
      {% for project in site.projects limit: 10 %}
      {
        "@type": "CreativeWork",
        "name": "{{ project.title | escape }}",
        "description": "{{ project.summary | truncate: 200 | escape }}",
        {% if project.image %}"image": "{{ project.image | absolute_url }}",{% endif %}
        "url": "{% if project.repo_url %}{{ project.repo_url }}{% else %}{{ project.url | absolute_url }}{% endif %}",
        "keywords": "{{ project.tags | join: ', ' }}",
        "datePublished": "{{ project.date | date_to_xmlschema }}"
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }    
  </script>
  {% endif %}
  {% if jekyll.environment == 'production' and site.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}
</head>
  
<body class="layout-home">
  <!-- Kontainer Induk -->
  <div class="site-wrapper">
    <!-- Navigation -->
    {% include navigation.html %}

    <!-- Main Content -->
    <main class="home-tabloid">
      <!-- Masthead (Judul site) -->
      <header class="masthead">
        <h1 class="site-name">{{ site.title }}</h1>
        <p class="site-desc">{{ site.description }}</p>
      </header>
      <!-- Konten dari index.md -->
      {{ content }}
      
    </main>

    <!-- Footer -->
    {% include footer.html %}
    
  </div>

  <!-- Scroll Navigation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const projectsGrid = document.getElementById('projectsGrid');
      const scrollPrev = document.querySelector('.scroll-prev');
      const scrollNext = document.querySelector('.scroll-next');
      const scrollDotsContainer = document.getElementById('scrollDots');
  
      if (projectsGrid && scrollPrev && scrollNext && scrollDotsContainer) {
        const cards = projectsGrid.querySelectorAll('.project-card');
        const scrollAmount = 400;
  
        // Generate dots
        cards.forEach((card, index) => {
          const dot = document.createElement('button');
          dot.className = 'scroll-dot';
          dot.setAttribute('aria-label', `Go to project ${index + 1}`);
          dot.addEventListener('click', function() {
            closeAllDetails();
            const cardOffset = card.offsetLeft;
            projectsGrid.scrollTo({
              left: cardOffset,
              behavior: 'smooth'
            });
          });
          scrollDotsContainer.appendChild(dot);
        });
  
        const dots = scrollDotsContainer.querySelectorAll('.scroll-dot');
  
        // Scroll Prev
        scrollPrev.addEventListener('click', function(e) {
          e.preventDefault();
          closeAllDetails();
          projectsGrid.scrollBy({
            left: -scrollAmount,
            behavior: 'smooth'
          });
        });
  
        // Scroll Next
        scrollNext.addEventListener('click', function(e) {
          e.preventDefault();
          closeAllDetails();
          projectsGrid.scrollBy({
            left: scrollAmount,
            behavior: 'smooth'
          });
        });
  
        // Fungsi update active dots
        function updateDots() {
          const gridScrollLeft = projectsGrid.scrollLeft;
          const gridWidth = projectsGrid.offsetWidth;
  
          cards.forEach((card, index) => {
            const cardLeft = card.offsetLeft;
            const cardWidth = card.offsetWidth;
            const cardCenter = cardLeft + (cardWidth / 2);
  
            const isVisible = Math.abs(gridScrollLeft + (gridWidth / 2) - cardCenter) < (cardWidth / 2);
  
            if (isVisible) {
              dots.forEach(d => d.classList.remove('active'));
              if (dots[index]) {
                dots[index].classList.add('active');
              }
            }
          });
        }
  
        // Fungsi tutup semua details
        function closeAllDetails() {
          const allDetails = projectsGrid.querySelectorAll('details[open]');
          allDetails.forEach(function(detail) {
            detail.removeAttribute('open');
          });
        }
  
        // Fungsi update status tombol prev/next
        function updateButtonState() {
          const maxScroll = projectsGrid.scrollWidth - projectsGrid.clientWidth;
  
          if (projectsGrid.scrollLeft <= 10) {
            scrollPrev.style.opacity = '0.3';
            scrollPrev.style.pointerEvents = 'none';
          } else {
            scrollPrev.style.opacity = '1';
            scrollPrev.style.pointerEvents = 'auto';
          }
  
          if (projectsGrid.scrollLeft >= maxScroll - 10) {
            scrollNext.style.opacity = '0.3';
            scrollNext.style.pointerEvents = 'none';
          } else {
            scrollNext.style.opacity = '1';
            scrollNext.style.pointerEvents = 'auto';
          }
        }
  
        // Update dots, button state & auto-close saat scroll
        projectsGrid.addEventListener('scroll', function() {
          closeAllDetails();
          updateDots();
          updateButtonState();
        });
  
        // Initial state check
        setTimeout(function() {
          updateDots();
          updateButtonState();
        }, 100);
      }
  
      // Mekanisme buka-tutup section Kisah
      const kisahToggleBtn = document.getElementById('kisahToggleBtn');
      const kisahTimelineWrap = document.getElementById('kisahTimelineWrap');
  
      if (kisahToggleBtn && kisahTimelineWrap) {
        const kisahLabel = kisahToggleBtn.querySelector('.kisah-toggle-label');
        const totalKisah = parseInt(kisahToggleBtn.getAttribute('data-total'), 10) || 0;
        const limitKisah = parseInt(kisahToggleBtn.getAttribute('data-limit'), 10) || 3;
        const sisaKisah = Math.max(totalKisah - limitKisah, 0);
  
        kisahToggleBtn.addEventListener('click', function() {
          const isExpanded = kisahTimelineWrap.classList.toggle('is-expanded');
          kisahToggleBtn.setAttribute('aria-expanded', String(isExpanded));
  
          if (kisahLabel) {
            kisahLabel.textContent = isExpanded
              ? 'Tampilkan Lebih Sedikit'
              : `Tampilkan ${sisaKisah} Kisah Lainnya`;
          }
  
          if (!isExpanded) {
            const kisahSection = document.getElementById('kisah');
            if (kisahSection) {
              kisahSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }
        });
      }

      // Helper aman agar tidak error jika gtag belum siap atau diblokir
      function trackGA4Event(eventName, params) {
        if (typeof gtag === 'function') {
          gtag('event', eventName, params);
        }
      }
      
      // 1. Klik tautan proyek: judul/deck (.project-title a), Detail Karya (.btn-secondary), Demo App (.btn-primary)
      document.querySelectorAll('.project-card').forEach(function(card) {
        const titleEl = card.querySelector('.project-title');
        const projectTitle = titleEl ? titleEl.textContent.trim() : 'unknown_project';
      
        card.addEventListener('click', function(e) {
          const link = e.target.closest('a');
          if (!link) return;
      
          let linkType = 'other';
          if (link.closest('.project-title')) {
            linkType = 'title_or_deck';
          } else if (link.classList.contains('btn-secondary')) {
            linkType = 'repo_detail';
          } else if (link.classList.contains('btn-primary')) {
            linkType = 'demo_app';
          }
      
          trackGA4Event('project_click', {
            project_title: projectTitle,
            link_type: linkType,
            link_url: link.href
          });
        });
      });
      
      // 2. Buka ringkasan proyek (<details class="project-summary">)
      document.querySelectorAll('details.project-summary').forEach(function(detailEl) {
        detailEl.addEventListener('toggle', function() {
          if (detailEl.open) {
            const card = detailEl.closest('.project-card');
            const titleEl = card ? card.querySelector('.project-title') : null;
            const projectTitle = titleEl ? titleEl.textContent.trim() : 'unknown_project';
      
            trackGA4Event('project_summary_open', {
              project_title: projectTitle
            });
          }
        });
      });
      
      // 3. Perluasan bagian Kisah (#kisahToggleBtn)
      if (kisahToggleBtn) {
        kisahToggleBtn.addEventListener('click', function() {
          const isNowExpanded = kisahTimelineWrap
            ? kisahTimelineWrap.classList.contains('is-expanded')
            : false;
      
          trackGA4Event('kisah_expand', {
            action_state: isNowExpanded ? 'expanded' : 'collapsed'
          });
        });
      }
      
      // 4. Klik menu navigasi utama (.site-navigation .nav-link)
      document.querySelectorAll('.site-navigation .nav-link').forEach(function(navLink) {
        navLink.addEventListener('click', function() {
          trackGA4Event('nav_click', {
            nav_label: navLink.textContent.trim(),
            nav_target: navLink.getAttribute('href') || ''
          });
        });
      });
      
      // 5. Klik tautan kontak di footer (.footer .footer-link)
      document.querySelectorAll('.footer .footer-link').forEach(function(footerLink) {
        footerLink.addEventListener('click', function() {
          const channel = (footerLink.getAttribute('aria-label') || footerLink.textContent || 'unknown')
            .trim()
            .toLowerCase();
      
          trackGA4Event('contact_click', {
            contact_channel: channel,
            contact_url: footerLink.getAttribute('href') || ''
          });
        });
      });
    });
  </script>
  
</body>
</html>
